<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delphi First Message — Inline Example</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Georgia, "Times New Roman", serif;
        background: #f7f5f1;
        color: #1a1a1a;
        min-height: 100vh;
        padding: 2rem 1.25rem 3rem;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: -0.02em;
        margin-bottom: 0.4rem;
      }

      .hint {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.8rem;
        color: #666;
        margin-bottom: 1.5rem;
        line-height: 1.5;
      }

      .hint code {
        background: #ebe7df;
        padding: 0.1em 0.35em;
        border-radius: 3px;
      }

      #embed {
        width: 100%;
        min-height: 600px;
        background: #fff;
        border: 1px solid #ddd6c8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Delphi First Message (inline)</h1>
      <p class="hint">
        Zero local dependencies — only change <code>YOUR_CHANNEL_ID</code>.
        Serve over HTTP, then open with <code>?q=Hello</code>
      </p>

      <!-- 1. Delphi embed — set your channel ID -->
      <div id="embed">
        <script
          src="https://www.delphi.ai/embed.js"
          data-channel="YOUR_CHANNEL_ID"
          data-mode="inline"
          data-width="100%"
          data-height="600"
          async
        ></script>
      </div>
    </main>

</html>
